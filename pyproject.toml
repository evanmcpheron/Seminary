[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seminary-curriculum-tools"
version = "0.1.0"
description = "Validation and scaffolding tools for an independent theological curriculum"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "jsonschema>=4",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
packages = ["seminary_tools"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
