course_description: Examines the philosophical and theological problem of suffering
  and evil through major Christian and philosophical treatments of the problem of
  pain.
curriculum_description: An undergraduate study of the philosophical and theological
  problem of suffering and evil that develops argument analysis, biblical-theological
  interpretation, charitable comparison of major positions, confessional synthesis,
  and pastorally responsible judgment.
confessional_framework: broadly_evangelical_protestant
learning_outcomes:
- id: LO-01
  statement: Distinguish and correctly use the central concepts, argument forms,
    and methodological categories in philosophical and theological treatments of
    suffering and evil.
  bloom_level: analyze
- id: LO-02
  statement: Reconstruct and evaluate major logical and evidential arguments from
    evil in premise-conclusion form without caricaturing their proponents.
  bloom_level: evaluate
- id: LO-03
  statement: Compare leading Christian defenses and theodicies, including their
    claims, limits, and principal objections.
  bloom_level: evaluate
- id: LO-04
  statement: Interpret representative biblical texts and canonical themes concerning
    suffering, evil, lament, providence, judgment, and hope using the ESV and NASB
    2020 responsibly.
  bloom_level: analyze
- id: LO-05
  statement: Present major non-Christian, skeptical, and intra-Christian perspectives
    accurately and charitably before offering confessional evaluation.
  bloom_level: evaluate
- id: LO-06
  statement: Formulate and defend a coherent broadly evangelical Protestant response
    to the problem of evil that integrates philosophical reasoning, Scripture, and
    historical theology while acknowledging unresolved objections.
  bloom_level: create
- id: LO-07
  statement: Differentiate philosophical explanation from pastoral response and
    apply trauma-aware, non-coercive, and appropriately bounded judgment to a case
    involving suffering.
  bloom_level: apply
